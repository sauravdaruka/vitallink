# Test-only settings. Spring Boot merges this file with src/main/resources/application.yml;
# being under config/, it does not replace the main file.
test:
  postgres:
    # Keep in sync with the image in docker-compose.yml.
    image: postgres:18
  rabbitmq:
    # Keep in sync with the image in docker-compose.yml.
    image: rabbitmq:4.3-management
  redis:
    # Keep in sync with the image in docker-compose.yml.
    image: redis:8.10
