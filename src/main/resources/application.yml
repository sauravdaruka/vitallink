spring:
  application:
    name: readings-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitallink}
    username: ${DB_USER:vitallink}
    password: ${DB_PASSWORD:vitallink}
    hikari:
      # Kept small on purpose: the database, not the thread count, is the limit.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast when the pool is exhausted instead of letting requests pile up.
      connection-timeout: 2000

readings:
  partitions:
    # Daily partitions are kept ready this many days back and ahead (UTC days).
    # days-back also matches the oldest reading we accept.
    days-back: 30
    days-ahead: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
