spring:
  application:
    name: readings-service
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # We authenticate devices with API keys, so Spring Boot's generated login user is not needed.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    problemdetails:
      # Errors are returned in the standard JSON error format (RFC 9457).
      enabled: true
  flyway:
    # db/seed holds local demo data. Production sets FLYWAY_LOCATIONS=classpath:db/migration.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:vitallink}
    password: ${RABBITMQ_PASSWORD:vitallink}
    # The relay waits for the broker to confirm each batch before marking events as sent.
    publisher-confirm-type: simple
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 10
        # After the last retry, a failing job goes to the dead-letter queue instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # The cache must never slow ingest down: if Redis doesn't answer quickly, we read PostgreSQL instead.
      timeout: 200ms
      connect-timeout: 200ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitallink}
    username: ${DB_USER:vitallink}
    password: ${DB_PASSWORD:vitallink}
    hikari:
      # Kept small on purpose: the database, not the thread count, is the limit.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast when the pool is exhausted instead of letting requests pile up.
      connection-timeout: 2000

readings:
  partitions:
    # Daily partitions are kept ready this many days back and ahead (UTC days).
    # days-back also matches the oldest reading we accept.
    days-back: 30
    days-ahead: 30
    # Runs at startup and then on this schedule (UTC).
    cron: "0 0 * * * *"
  ingest:
    # Bigger batches get 413, so one request can't hold a database connection for long.
    max-batch-size: 500

outbox:
  relay:
    # How often unsent events are picked up. Alert delay is roughly this plus the worker's time.
    interval: 200ms
    batch-size: 100
    confirm-timeout-millis: 5000
  cleanup:
    # Sent events are kept this long, to investigate problems, then removed so the table stays small.
    retention: 7d
    cron: "0 30 * * * *"

thresholds:
  cache:
    # Long enough to still be there when a device sends again (every 30 minutes to a few hours). A threshold
    # update deletes the entry, so this is only a safety net.
    ttl: 24h
    # After a threshold update, the cached entry is deleted again after this delay, to remove an old copy that a
    # slow request may have written back just after the first delete.
    settle-delay: 1s

summary:
  llm:
    # A summary never waits longer than this for the model; after that the coach gets the fallback.
    timeout: 3s
    # At most this many model calls at once per instance (provider rate limit and cost); more get the fallback.
    max-concurrent-calls: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      # Redis is only a cache. If it is down the service still works, so it must not mark the service unhealthy.
      enabled: false
