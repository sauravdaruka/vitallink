services:
  app:
    # Built from the Dockerfile; `docker compose up --build` rebuilds it after code changes.
    build: .
    environment:
      # Inside Docker the other services are reached by their service names, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vitallink}
      DB_USER: ${DB_USER:-vitallink}
      DB_PASSWORD: ${DB_PASSWORD:-vitallink}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-vitallink}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vitallink}
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    # Starts only once its dependencies accept connections, so startup (migrations, queues) doesn't fail.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # Keep in sync with test.postgres.image in src/test/resources/config/application.yml.
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-vitallink}
      POSTGRES_USER: ${DB_USER:-vitallink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vitallink}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Keep in sync with test.rabbitmq.image in src/test/resources/config/application.yml.
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vitallink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vitallink}
    ports:
      - "5672:5672"
      # Management UI: http://localhost:15672
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Keep in sync with test.redis.image in src/test/resources/config/application.yml.
    image: redis:8.10
    # Used only as a cache: nothing is written to disk, and when memory is full the least recently used
    # entries are dropped (they are reloaded from PostgreSQL when needed).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
