services:
  postgres:
    # Keep in sync with test.postgres.image in src/test/resources/config/application.yml.
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-vitallink}
      POSTGRES_USER: ${DB_USER:-vitallink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vitallink}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Keep in sync with test.rabbitmq.image in src/test/resources/config/application.yml.
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vitallink}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vitallink}
    ports:
      - "5672:5672"
      # Management UI: http://localhost:15672
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
